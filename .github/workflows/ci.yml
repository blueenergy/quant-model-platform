name: CI

on:
  push:
    branches: [main, master, develop, fix_*]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main, master, develop]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  PIP_CACHE_DIR: ./.cache/pip
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DEFAULT_TIMEOUT: '120'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  docker:
    name: Build & Push Docker image (ghcr.io)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/blueenergy/quant-model-platform
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Bump image tag in quant-infrastructure & trigger deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [docker]
    steps:
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: blueenergy/quant-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
      - name: Wait for the tag to reach ACR
        env:
          ACR_REGISTRY: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          ACR_REPO: wukongquant/quant-model-trainer
          TAG: ${{ steps.tag.outputs.tag }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: bash infra/scripts/wait-for-acr-tag.sh
      - name: Bump versions.env with release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEY: QUANT_MODEL_TRAINER_IMAGE_TAG
          DEPLOY_LABEL: quant-model-platform
          SOURCE_REPO: ${{ github.repository }}
          NEW_SHA: ${{ github.sha }}
          APP_REPO_DIR: ${{ github.workspace }}
          INFRA_DIR: ${{ github.workspace }}/infra
          SERVICES: quant-model-trainer
        run: bash infra/scripts/bump-versions-env.sh
      - name: Trigger centralized deploy
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api --method POST \
            repos/blueenergy/quant-infrastructure/dispatches \
            -f event_type=deploy \
            -f 'client_payload[services]=quant-model-trainer' \
            -f "client_payload[tag]=${TAG}"

  notify-dingtalk:
    name: Notify DingTalk on failure
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [test, docker, release]
    uses: blueenergy/quant-infrastructure/.github/workflows/notify-dingtalk.yml@main
    secrets:
      DATA_CONTRACT_WEBHOOK_URL: ${{ secrets.DATA_CONTRACT_WEBHOOK_URL }}
      DATA_CONTRACT_WEBHOOK_SECRET: ${{ secrets.DATA_CONTRACT_WEBHOOK_SECRET }}
    with:
      workflow: ${{ github.workflow }}
      needs_json: ${{ toJSON(needs) }}
