[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-model-platform"
version = "0.1.0"
description = "Standalone ML training platform for quant (quant_ml + Parquet snapshots)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pymongo>=4.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pydantic>=2.0",
    "scipy>=1.10",
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_model_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
